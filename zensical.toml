# ---------------------------------------------------------------------------
# Open Science @ TUM — mock site
# Layout/style skeleton imitating https://www.ub.tum.de/en/open-access
# ---------------------------------------------------------------------------

[project]
site_url = "https://miholzbo.github.io/open-science-tum-mock/"
site_name = "Open Science"
site_description = "Mock of a central entry point for Open Science at TUM (not an official TUM website)"

copyright = "Mock page for illustration &middot; not an official TUM website"

nav = [
  { "Variant A" = "index.md" },
  { "Variant B" = [
    "variant-b/index.md",
    { "Backup" = "variant-b/backup.md" },
  ] },
]

extra_css = ["stylesheets/tum.css"]

[project.theme]
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.svg"
features = [
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",      # breadcrumbs, like "Home > Research & Publishing > ..."
  "navigation.sections",  # TUM-style coloured menu blocks
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Shown in the dark bar above the header (see overrides/main.html)
[project.extra]
[[project.extra.quicklinks]]
name = "Quicklink 1"
link = "#"

[[project.extra.quicklinks]]
name = "Quicklink 2"
link = "#"

[[project.extra.quicklinks]]
name = "Quicklink 3"
link = "#"

[[project.extra.quicklinks]]
name = "Quicklink 4"
link = "#"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
